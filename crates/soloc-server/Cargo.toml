[package]
name = "soloc-server"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "soloc-server"
path = "src/main.rs"

[dependencies]
soloc-ledger = { path = "../soloc-ledger" }
spacetimestamp = { path = "../spacetimestamp" }
arrow.workspace = true
arrow-flight.workspace = true
tonic = { version = "0.14", features = ["transport"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
prost = "0.14"
anise.workspace = true
hifitime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
nalgebra.workspace = true
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
url = "2"
