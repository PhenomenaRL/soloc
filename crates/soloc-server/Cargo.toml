[package]
name = "soloc-server"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "soloc-server"
path = "src/main.rs"

[dependencies]
soloc = { path = "../soloc" }
spacetimestamp = { path = "../spacetimestamp" }
arrow = "57.1.0"
arrow-flight = "57.1.0"
tonic = { version = "0.14", features = ["transport"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
prost = "0.14"
anise = "0.9.4"
hifitime = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
nalgebra = "0.35"
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
url = "2"
