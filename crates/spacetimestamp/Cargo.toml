[package]
name = "spacetimestamp"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anise = "0.9.4"
arrow = "57.1.0"
hifitime = "4.2.4"
log = "0.4"
nalgebra = "0.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[dev-dependencies]
test-log = "0.2.19"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "spacetimestamp_bench"
harness = false
