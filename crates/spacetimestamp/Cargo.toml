[package]
name = "spacetimestamp"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
# File parsing stays separate from kernel-free GPS coordinate/pose conversion.
gpx = ["dep:quick-xml", "dep:chrono"]

[dependencies]
anise.workspace = true
arrow.workspace = true
hifitime.workspace = true
log.workspace = true
nalgebra.workspace = true
sha2 = "0.11"
quick-xml = { version = "0.41", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
test-log.workspace = true
criterion.workspace = true
