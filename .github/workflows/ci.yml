name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs when a PR branch is force-pushed or updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Kernel-dependent tests are #[ignore]d, so this downloads no SPICE data.
      # To run them locally: cargo test --workspace -- --ignored
      - run: cargo test --workspace
      # Optional GPX parsing, local ingestion and Flight submission are not built by default.
      - run: cargo test --workspace --all-features

  visualizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - run: npm ci --prefix visualizer
      # Includes the checked-in artifact generated by the production GPX exporter.
      - run: npm --prefix visualizer test
      - run: npm --prefix visualizer run build
