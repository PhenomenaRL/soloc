version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # arrow and arrow-flight must move in lockstep — bumping one alone
      # leaves two incompatible arrow versions in the dependency tree.
      arrow:
        patterns: ["arrow*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
